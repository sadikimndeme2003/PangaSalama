{% extends "base.html" %}
{% block title %}Umesahau Nenosiri | PangaSalama{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <h1 class="text-xl font-bold text-slate-800 mb-2 text-center">Umesahau Nenosiri?</h1>
    <p class="text-sm text-slate-500 text-center mb-6">
        Weka barua pepe na namba ya simu uliyosajili nazo, kisha weka nenosiri jipya.
    </p>
    <form method="post" class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="text-sm text-slate-600">Barua pepe</label>
            <input type="email" name="email" required class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm text-slate-600">Namba ya simu uliyosajili nayo</label>
            <input type="tel" name="phone" required class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm text-slate-600">Nenosiri Jipya</label>
            <input type="password" id="password-input" name="new_password" required minlength="6" class="w-full border border-slate-200 rounded-lg px-3 py-2 mt-1">
            <div class="h-1.5 bg-slate-100 rounded-full mt-2 overflow-hidden">
                <div id="password-strength-bar" class="h-full w-0 transition-all"></div>
            </div>
            <p id="password-strength-label" class="text-[11px] text-slate-400 mt-1">Angalau herufi 6</p>
        </div>
        <button type="submit" class="w-full bg-brand-teal hover:bg-brand-teal-dark text-white rounded-lg py-2.5 font-semibold">
            Badilisha Nenosiri
        </button>
        <p class="text-center text-sm text-slate-500">
            <a href="{{ url_for('auth.login') }}" class="text-brand-teal-dark font-semibold">Rudi kwenye Ingia</a>
        </p>
    </form>
</div>

<script>
(function () {
    const input = document.getElementById('password-input');
    const bar = document.getElementById('password-strength-bar');
    const label = document.getElementById('password-strength-label');

    const levels = [
        { width: '0%', color: 'bg-slate-200', text: 'Angalau herufi 6' },
        { width: '33%', color: 'bg-rose-400', text: 'Dhaifu' },
        { width: '66%', color: 'bg-amber-400', text: 'Wastani' },
        { width: '100%', color: 'bg-emerald-500', text: 'Imara' },
    ];

    input.addEventListener('input', function () {
        const val = input.value;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10 && /[0-9]/.test(val)) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val) && /[^A-Za-z0-9]/.test(val)) score++;

        const level = levels[Math.min(score, 3)];
        bar.className = `h-full transition-all ${level.color}`;
        bar.style.width = level.width;
        label.textContent = val ? level.text : 'Angalau herufi 6';
    });
})();
</script>
{% endblock %}
